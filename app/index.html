<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  // iPhone・iPad：入力欄を押したときに画面が拡大されないように（指2本での拡大は iOS ではそのまま使える）
  // Android は押しても拡大しないので、指での拡大を止めないよう何もしない
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1))
    document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
</script>
<meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MD WS">
<title>MD Workstation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="desk.css">
<link rel="stylesheet" href="ws/notes.css" media="(min-width: 700px) and (min-height: 500px)">
</head>
<body>
<div class="app">
  <!-- PC の幅のとき：左端のレール（Mac の Workstation と同じ） -->
  <nav class="rail" id="rail">
    <div class="railTop drag"></div>
    <div class="railLogo" title="MD Workstation"><span class="logo"><svg class="lc" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="2" fill="currentColor" opacity=".38"/><rect x="4" y="13" width="7" height="7" rx="2" fill="currentColor" opacity=".38"/><path d="M16.5 13.6a2.9 2.9 0 1 1-2.9 2.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
    <div class="railApps" id="railApps"></div>
    <div class="railBottom" id="railBottom"></div>
  </nav>
  <!-- PC の幅のとき：サイドバー（開いている画面によって中身が変わる） -->
  <aside class="side" id="side">
    <div class="drag sideDrag"></div>
    <div class="sideHead"><span class="wordmark">MD Workstation</span><h2 id="sideTitle"></h2><button class="iconBtn plain sideHide" id="sideHide" type="button" title="サイドバーを隠す" data-icon="panel-left-close"></button></div>
    <button class="sideSearch" id="sideSearch" type="button"><span class="ic" data-icon="search"></span><span class="t">検索・移動</span><kbd>⌘K</kbd></button>
    <div class="sideBody" id="sideBody"></div>
  </aside>
  <div class="center">
    <header class="top">
      <button class="iconBtn white sideShow" id="sideShow" type="button" title="サイドバーを出す" data-icon="panel-left"></button>
      <div class="ttl"><small id="eyebrow">WORKSTATION</small><h1 id="title">ホーム</h1></div>
      <div class="topActs" id="topActs"></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<!-- 下のタブ：Workstation モバイルと同じ形 -->
<nav class="tabs" id="tabs">
  <button type="button" data-tab="home" aria-label="ホーム" title="ホーム"><span class="ric" data-icon="house"></span><b>ホーム</b></button>
  <button type="button" data-tab="todo" aria-label="やること" title="やること"><span class="ric" data-icon="list-todo"></span><b>やること</b></button>
  <button type="button" data-tab="proj" aria-label="プロジェクト" title="プロジェクト"><span class="ric" data-icon="folder-kanban"></span><b>プロジェクト</b></button>
  <button type="button" data-tab="cal" aria-label="カレンダー" title="カレンダー"><span class="ric" data-icon="calendar-days"></span><b>カレンダー</b></button>
  <button type="button" data-tab="habits" aria-label="毎日確認" title="毎日確認"><span class="ric" data-icon="calendar-check"></span><b>毎日確認</b></button>
  <button type="button" data-tab="notes" aria-label="ノート" title="ノート"><span class="ric" data-icon="notebook-text"></span><b>ノート</b></button>
  <button type="button" data-tab="graph" aria-label="つながり" title="つながり"><span class="ric" data-icon="orbit"></span><b>つながり</b></button>
  <button type="button" data-tab="money" aria-label="お金" title="お金"><span class="ric" data-icon="wallet"></span><b>お金</b></button>
  <button type="button" data-tab="health" aria-label="ヘルス" title="ヘルス"><span class="ric" data-icon="heart-pulse"></span><b>ヘルス</b></button>
  <button type="button" data-tab="sync" aria-label="同期" title="同期"><span class="ric" data-icon="refresh-cw"><i class="badge" id="syncBadge" hidden></i></span><b>同期</b></button>
</nav>

<dialog id="sheet"><div class="sheetIn" id="sheetIn"></div></dialog>
<div id="toast" hidden></div>

<script src="icons.js"></script>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="ws/ui.js"></script>
<script src="ws/keys.js"></script>
<script src="ws/notes.js"></script>
<script src="graph.js"></script>
<script src="daily.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
