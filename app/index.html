<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MD WS">
<title>MD Workstation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="ttl"><small id="eyebrow">WORKSTATION</small><h1 id="title">ホーム</h1></div>
  <div class="topActs" id="topActs"></div>
</header>

<main id="view"></main>

<!-- 下のタブ：Workstation モバイルと同じ形 -->
<nav class="tabs" id="tabs">
  <button type="button" data-tab="home"><span class="ric" data-icon="house"></span><b>ホーム</b></button>
  <button type="button" data-tab="todo"><span class="ric" data-icon="list-todo"></span><b>やること</b></button>
  <button type="button" data-tab="proj"><span class="ric" data-icon="folder-kanban"></span><b>プロジェクト</b></button>
  <button type="button" data-tab="cal"><span class="ric" data-icon="calendar-days"></span><b>カレンダー</b></button>
  <button type="button" data-tab="notes"><span class="ric" data-icon="notebook-text"></span><b>ノート</b></button>
  <button type="button" data-tab="sync"><span class="ric" data-icon="refresh-cw"><i class="badge" id="syncBadge" hidden></i></span><b>同期</b></button>
</nav>

<dialog id="sheet"><div class="sheetIn" id="sheetIn"></div></dialog>
<div id="toast" hidden></div>

<script src="icons.js"></script>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<script src="daily.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
